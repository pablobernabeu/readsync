[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "readsync"
version = "0.1.0"
description = "Toolkit for reading experiments with eye-tracking and EEG markers, with annotated stimuli and an encrypted, tamper-evident session log."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pablo Bernabeu" }]
keywords = ["reading", "eye-tracking", "psycholinguistics", "EEG", "offline", "open-science"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

# The core depends only on cryptography, so the package installs and its tests run
# without research hardware or a display. Heavy, platform-specific or
# hardware-specific dependencies are optional extras.
dependencies = [
  "cryptography>=42.0",
]

[project.optional-dependencies]
# Stimulus presentation on a screen. PsychoPy is large and platform-sensitive, so it
# is opt-in. The headless presenter needs none of it.
present = ["psychopy>=2024.1"]
# The EyeLink backend. SR Research publishes pylink on PyPI under a proprietary
# licence that permits educational and non-commercial use.
eyelink = ["sr-research-pylink"]
# Webcam gaze: camera capture and MediaPipe's FaceLandmarker. MediaPipe depends on
# opencv-contrib-python, which provides cv2, so OpenCV is not listed separately.
# Releases 0.10.30 and 0.10.31 omit that dependency and are excluded.
# PsychoPy depends on opencv-python, so an environment with both the present and
# webcam extras holds two cv2 builds, and whichever was installed last provides
# the module. The bound matches the MediaPipe release series pinned in the
# browser demo.
webcam = ["mediapipe>=0.10,<0.11,!=0.10.30,!=0.10.31"]
# Building the stimulus sets with frequency annotation. The JSON files ship with
# the frequencies, so running a session needs none of it.
stimuli = ["wordfreq>=3.1.1,<4"]
# Lab Streaming Layer marker transport for EEG co-registration.
lsl = ["pylsl>=1.16"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/pablobernabeu/readsync"
Repository = "https://github.com/pablobernabeu/readsync"
Issues = "https://github.com/pablobernabeu/readsync/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/readsync"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/readsync"]

# Optional hardware and vision dependencies are imported lazily and ship no type
# stubs. Ignoring their missing imports keeps type-checking identical whether or
# not the extras are installed, so it matches both CI and a lab or webcam machine.
[[tool.mypy.overrides]]
module = ["cv2", "mediapipe", "mediapipe.*", "pylink", "psychopy", "psychopy.*", "pylsl"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
